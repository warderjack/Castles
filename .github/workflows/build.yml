name: build
on: [push, pull_request]
jobs:
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, fedora:latest, archlinux:latest, alpine:latest, opensuse/tumbleweed]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install helper tools
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y sudo findutils; fi
          if command -v dnf >/dev/null; then dnf install -y findutils sudo; fi
          if command -v pacman >/dev/null; then pacman -Syu --noconfirm; fi
      - name: install.sh (installs dependencies and builds)
        run: ./install.sh --yes
      - name: Binary starts
        run: |
          ls -la port/build/castles_native
          port/build/castles_native 2>&1 | grep -q usage
